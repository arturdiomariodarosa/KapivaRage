<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><title>Villa Itapirubá | Prévia reservada</title><style>html,body{margin:0;height:100%;background:#f8f6f0;color:#123e46;font:16px system-ui}main{padding:32px;max-width:420px;margin:auto}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}</style></head><body><main><h1>Villa Itapirubá</h1><p id="status">Abra o link completo de avaliação recebido do proprietário.</p></main><script>
(async()=>{const status=document.getElementById('status');const raw=location.hash.slice(1);if(!/^[A-Za-z0-9_-]{43}$/.test(raw))return;try{status.textContent='Carregando a prévia da casa...';const key=Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')+'='),c=>c.charCodeAt(0));const parts=await Promise.all(Array.from({length:8},async(_,i)=>{const r=await fetch('villa-'+i+'.bin');if(!r.ok)throw Error('download');return r.arrayBuffer()}));const enc=new Uint8Array(await new Blob(parts).arrayBuffer());const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:enc.slice(0,12)},k,enc.slice(12));const html=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).blob();const frame=document.createElement('iframe');frame.title='Villa Itapirubá';frame.referrerPolicy='no-referrer';frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox');frame.allow='autoplay; fullscreen';frame.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));document.body.append(frame);}catch(e){status.textContent='Não foi possível abrir. Confira se o link está completo e utilize um navegador atualizado.'}})();</script></body></html>
